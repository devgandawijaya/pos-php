name: pos-enterprise-prod

services:
  # 1. Production Laravel PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: pos-enterprise-prod-app:latest
    container_name: pos_prod_app
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-pos_saas}
      - DB_USERNAME=${DB_USERNAME:-pos_user}
      - DB_PASSWORD=${DB_PASSWORD:-pos_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pos-prod-network

  # 2. Production Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pos_prod_nginx
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pos-prod-network

  # 3. Production PostgreSQL Database (Persistent)
  postgres:
    image: postgres:16-alpine
    container_name: pos_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pos_saas}
      POSTGRES_USER: ${DB_USERNAME:-pos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pos_secret}
    volumes:
      - pos_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pos_user} -d ${DB_DATABASE:-pos_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos-prod-network

  # 4. Production Redis Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: pos_prod_redis
    restart: always
    volumes:
      - pos_prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - pos-prod-network

  # 5. Production Asynchronous Queue Worker
  queue-worker:
    image: pos-enterprise-prod-app:latest
    container_name: pos_prod_queue_worker
    restart: always
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-pos_saas}
      - DB_USERNAME=${DB_USERNAME:-pos_user}
      - DB_PASSWORD=${DB_PASSWORD:-pos_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pos-prod-network

  # 6. Production Cron Scheduler
  scheduler:
    image: pos-enterprise-prod-app:latest
    container_name: pos_prod_scheduler
    restart: always
    command: sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-pos_saas}
      - DB_USERNAME=${DB_USERNAME:-pos_user}
      - DB_PASSWORD=${DB_PASSWORD:-pos_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pos-prod-network

volumes:
  pos_prod_pgdata:
    driver: local
  pos_prod_redisdata:
    driver: local

networks:
  pos-prod-network:
    driver: bridge

